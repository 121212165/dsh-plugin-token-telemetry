name: dist-guard
on: [push, workflow_dispatch]
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 25
      - run: npm install --no-audit --no-fund
      - name: typecheck + test
        run: npm run check
